name: YaN Studio - Xu Ly Video Tu Dong

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-comfortaa fonts-roboto fontconfig
          fc-cache -fv
          pip install -q google-genai requests edge-tts git+https://github.com/K07VN/capcut-tts-api.git

      - name: Download uploaded video
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p input_dir
          gh release download ${{ github.event.release.tag_name }} --dir input_dir

      - name: Run Video Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EPISODE: ${{ github.event.release.name || github.event.release.tag_name }}
        run: python run.py

      - name: Upload Final Video to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} Video_HoanThanh.mp4 --clobber
