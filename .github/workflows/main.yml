name: YaN Studio - Xu Ly Video Tu Dong

on:
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-comfortaa fonts-roboto fontconfig
          fc-cache -fv
          pip install -q google-genai requests edge-tts git+https://github.com/K07VN/capcut-tts-api.git

      - name: Download uploaded videos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p input_dir
          gh release download --pattern "*" --dir input_dir

      - name: Run Video Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python run.py

      # ĐẢM BẢO 100%: LƯU VIDEO VÀO MỤC ARTIFACTS ĐỂ TẢI VỀ KỂ CẢ KHI RELEASE BỊ KẸT
      - name: Upload Video to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Video_Thanh_Pham
          path: Video_HoanThanh_*.mp4
          retention-days: 7
